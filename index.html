<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joaca sunetelor</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#2d2a32;--soft:#7a7083;--green:#3bb273;--red:#e15554;--blue:#4d9de0;--yellow:#e1bc29;--purple:#7768ae;--orange:#f08a4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:1.3rem;margin:0;flex:1;text-align:center}
.stars{font-weight:800;font-size:1.1rem;background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 #0001;white-space:nowrap}
.back{background:none;border:none;font:inherit;font-size:1rem;color:var(--soft);cursor:pointer;padding:4px 0;white-space:nowrap}
.hint{color:var(--soft);font-size:.95rem;margin:6px 0}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 4px 0 #0001;text-align:center;margin-bottom:14px}
.label{font-size:.9rem;color:var(--soft);margin:10px 0 4px;font-weight:700}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{border:none;border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;background:#ece6f5;cursor:pointer;font-size:1rem}
.seg.sounds button{font-size:1.5rem;min-width:56px;padding:4px 10px}
.seg button.on{background:var(--ink);color:#fff}
.modes{display:grid;gap:12px}
.mode{border:none;border-radius:20px;padding:14px 16px;font:inherit;font-weight:700;font-size:1.25rem;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0002;display:flex;align-items:center;gap:14px;text-align:left}
.mode span{font-size:2.4rem}
.mode small{display:block;font-weight:500;font-size:.85rem;opacity:.9}
.img{line-height:1.1;user-select:none;display:inline-flex;align-items:center;justify-content:center}
.img svg{width:1em;height:1em}
.big{font-size:7rem}
.word{font-size:2rem;font-weight:800;min-height:3rem}
.word b,.small-word b{color:var(--red)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:16px;padding:12px 18px;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;background:#ece6f5;color:var(--ink);box-shadow:0 3px 0 #0002}
.btn.lg{font-size:1.35rem;padding:14px 24px}
.btn.g{background:var(--green);color:#fff}.btn.r{background:var(--red);color:#fff}.btn.b{background:var(--blue);color:#fff}.btn.p{background:var(--purple);color:#fff}.btn.o{background:var(--orange);color:#fff}
.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--blue);width:0%}
.pill{display:inline-block;background:#f3eefa;border-radius:999px;padding:2px 12px;font-weight:700;margin:2px}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.hidden{display:none!important}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{aspect-ratio:3/4;perspective:600px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f,.mcard .bk{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mcard .bk{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-size:2rem;font-weight:800;box-shadow:0 3px 0 #0002}
.mcard .f{background:#fff;border:3px solid #ece6f5;transform:rotateY(180deg);font-size:2.6rem}
.mcard.done .f{border-color:var(--green);background:#effaf3}
.small-word{font-size:.8rem;font-weight:700;margin-top:2px}
/* ce lipseste */
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.lcell{background:#faf7ff;border-radius:16px;padding:8px 4px;font-size:3.2rem;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lcell.q{background:#fff3e6;color:var(--orange);font-weight:800}
.curtain{font-size:6rem;padding:40px 0}
.mgrid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.icell{background:#faf7ff;border-radius:18px;padding:10px 4px;font-size:4.2rem;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:3px solid transparent;transition:background .2s}
.icell.ok{background:#effaf3;border-color:var(--green)}
.icell.no{background:#fdecec;border-color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.modes2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes2 .mode{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;font-size:1.1rem}
.modes2 .mode span{font-size:2rem}
.baskets{display:grid;gap:10px;margin-top:12px}
.basket{border:none;border-radius:18px;padding:10px;font:inherit;font-weight:800;font-size:1.05rem;background:#fff3e0;cursor:pointer;box-shadow:0 3px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:2px}
.basket .ic{font-size:2.2rem}
.basket .dots{letter-spacing:4px;color:var(--orange);font-size:1.1rem}
.basket .n{font-size:.85rem;color:var(--soft)}
.basket.no{background:#fdecec}
.basket.ok{background:#effaf3}
.fly{animation:fly .5s forwards}
@keyframes fly{to{transform:translateY(120px) scale(.2);opacity:0}}
.sea{position:relative;height:62vh;min-height:380px;border-radius:24px;overflow:hidden;background:linear-gradient(#bde0fe 0%,#8ecae6 12%,#219ebc 70%,#126782 100%);touch-action:manipulation}
.sea .wave{position:absolute;top:8%;left:0;right:0;height:10px;background:radial-gradient(circle at 10px -4px,transparent 12px,#bde0fe 13px) repeat-x;background-size:20px 10px;opacity:.8}
.fish{position:absolute;left:0;top:0;will-change:transform;width:118px;height:76px;cursor:pointer;user-select:none}
.fish svg.body{position:absolute;inset:0;width:100%;height:100%}
.fish .fimg{position:absolute;left:22px;top:12px;width:58px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.1rem}
.fish.flip .fimg{left:38px}
.bubble{position:absolute;bottom:-10px;width:10px;height:10px;border-radius:50%;border:2px solid #ffffff99;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-70vh);opacity:0}}
.caught{position:absolute;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:5}
.caught .card{margin:0 16px}
.reels{display:flex;gap:10px;justify-content:center;margin:10px 0}
.reel{flex:1;max-width:150px;background:#faf7ff;border:4px solid #ece6f5;border-radius:18px;padding:10px 2px;font-size:3.6rem;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reel.spin .img{filter:blur(1.5px)}
.note{font-size:.85rem;color:var(--soft);background:#fff;border-radius:12px;padding:8px 12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back hidden" id="backBtn">← Înapoi</button>
    <h1 id="title">🎈 Joaca sunetelor</h1>
    <div class="stars">⭐ <span id="starCount">0</span></div>
  </header>
  <div id="view"></div>
</div>

<script>
// ---------- IMAGINI SPECIALE ----------
const SVG = {
  nisip:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="86" rx="46" ry="6" fill="#d9b25a" opacity=".5"/><path d="M6 86 C22 50 38 40 50 40 C64 40 78 52 94 86 Z" fill="#f2cf7a"/><path d="M14 86 C28 60 40 52 50 52 C62 52 74 62 86 86 Z" fill="#e8bd5c" opacity=".6"/><g fill="#c99a3d"><circle cx="30" cy="70" r="1.8"/><circle cx="42" cy="58" r="1.5"/><circle cx="56" cy="64" r="1.8"/><circle cx="66" cy="74" r="1.5"/><circle cx="48" cy="78" r="1.6"/><circle cx="38" cy="80" r="1.3"/><circle cx="74" cy="80" r="1.6"/><circle cx="24" cy="80" r="1.4"/><circle cx="60" cy="50" r="1.3"/></g><line x1="74" y1="18" x2="62" y2="48" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/><path d="M55 44 L70 50 L64 64 Q56 66 52 58 Z" fill="#e15554"/></svg>`,
  jeleu:`<svg viewBox="0 0 100 100"><g opacity=".92"><g fill="#e63946"><circle cx="32" cy="30" r="13"/><circle cx="21" cy="19" r="6"/><circle cx="43" cy="19" r="6"/><ellipse cx="32" cy="58" rx="17" ry="20"/><circle cx="16" cy="48" r="6"/><circle cx="48" cy="48" r="6"/><circle cx="20" cy="76" r="7"/><circle cx="44" cy="76" r="7"/></g><g fill="#52b788"><circle cx="70" cy="40" r="13"/><circle cx="59" cy="29" r="6"/><circle cx="81" cy="29" r="6"/><ellipse cx="70" cy="68" rx="17" ry="20"/><circle cx="54" cy="58" r="6"/><circle cx="86" cy="58" r="6"/><circle cx="58" cy="86" r="7"/><circle cx="82" cy="86" r="7"/></g></g><g fill="#fff" opacity=".55"><ellipse cx="27" cy="26" rx="4" ry="3"/><ellipse cx="25" cy="52" rx="4" ry="7"/><ellipse cx="65" cy="36" rx="4" ry="3"/><ellipse cx="63" cy="62" rx="4" ry="7"/></g><g fill="#3a0d12"><circle cx="28" cy="29" r="1.6"/><circle cx="36" cy="29" r="1.6"/><circle cx="66" cy="39" r="1.6"/><circle cx="74" cy="39" r="1.6"/></g></svg>`,
  pijama:`<svg viewBox="0 0 100 100"><path d="M8 22 L24 12 L36 12 Q42 20 48 12 L60 12 L76 22 L70 40 L62 36 L62 70 L22 70 L22 36 L14 40 Z" fill="#8ecae6" stroke="#219ebc" stroke-width="2" stroke-linejoin="round"/><path d="M42 18 L42 70" stroke="#219ebc" stroke-width="1.5"/><g fill="#219ebc"><circle cx="42" cy="32" r="1.8"/><circle cx="42" cy="46" r="1.8"/><circle cx="42" cy="60" r="1.8"/></g><path d="M30 30 a7 7 0 1 0 7 9 a5.5 5.5 0 1 1 -7 -9z" fill="#ffd166"/><g fill="#ffd166"><circle cx="54" cy="52" r="2"/><circle cx="30" cy="58" r="2"/></g><path d="M66 46 L94 46 L96 94 L84 94 L80 62 L78 94 L66 94 Z" fill="#8ecae6" stroke="#219ebc" stroke-width="2" stroke-linejoin="round"/><g fill="#ffd166"><circle cx="72" cy="60" r="2"/><circle cx="88" cy="74" r="2"/><circle cx="71" cy="84" r="2"/></g></svg>`,
  teava:`<svg viewBox="0 0 100 100"><path d="M6 34 L62 34 Q78 34 78 50 L78 94 L58 94 L58 54 L6 54 Z" fill="#adb5bd" stroke="#6c757d" stroke-width="2.5" stroke-linejoin="round"/><path d="M6 39 L60 39 Q73 39 73 52 L73 94" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/><rect x="2" y="30" width="10" height="28" rx="2" fill="#868e96" stroke="#495057" stroke-width="2"/><rect x="30" y="30" width="10" height="28" rx="2" fill="#868e96" stroke="#495057" stroke-width="2"/><rect x="54" y="70" width="28" height="10" rx="2" fill="#868e96" stroke="#495057" stroke-width="2"/></svg>`,
  colt:`<svg viewBox="0 0 100 100"><path d="M50 8 L50 66 L6 88 L6 4 Z" fill="#f4e3c3"/><path d="M50 8 L50 66 L94 88 L94 4 Z" fill="#e9cfa0"/><path d="M50 66 L6 88 L6 98 L94 98 L94 88 Z" fill="#b5835a"/><path d="M50 8 L50 66" stroke="#e15554" stroke-width="4" stroke-linecap="round"/><path d="M50 66 L6 88 M50 66 L94 88" stroke="#8d6040" stroke-width="2"/><circle cx="50" cy="66" r="5" fill="#e15554"/><rect x="62" y="24" width="18" height="22" fill="#fff" stroke="#c9a46c" stroke-width="2" transform="skewY(14) translate(0 -16)"/></svg>`
};
const imgHTML = e => e.startsWith("svg:") ? SVG[e.slice(4)] : e;

// ---------- CUVINTE (p: i=început, m=mijloc, f=final) ----------
const W = (list,p) => list.map(([w,e])=>({w,e,p}));
const SOUNDS = {
  s:{l:"S",re:/([sS])/g,words:[
    ...W([["soare","☀️"],["sanie","🛷"],["sare","🧂"],["supă","🍲"],["suc","🧃"],["sabie","🗡️"],["semafor","🚦"],["salată","🥗"],["sirenă","🧜‍♀️"],["scaun","🪑"],["scară","🪜"],["săpun","🧼"],["stea","⭐"],["steag","🚩"],["struguri","🍇"],["scoică","🐚"]],"i"),
    ...W([["pisică","🐱"],["casă","🏠"],["nisip","svg:nisip"],["castel","🏰"],["castravete","🥒"],["pasăre","🐦"],["mască","😷"],["cască","⛑️"],["astronaut","🧑‍🚀"],["gâscă","🪿"],["biscuit","🍪"],["muscă","🪰"],["castron","🥣"],["fasole","🫘"]],"m"),
    ...W([["urs","🐻"],["nas","👃"],["ananas","🍍"],["cactus","🌵"],["os","🦴"],["ceas","⏰"],["dans","💃"],["tenis","🎾"]],"f")]},
  sh:{l:"Ș",re:/([șşȘŞ])/g,words:[
    ...W([["șarpe","🐍"],["șoarece","🐭"],["șosete","🧦"],["șapcă","🧢"],["șurub","🔩"],["școală","🏫"],["șah","♟️"],["șuncă","🥓"],["șopârlă","🦎"],["șase","6️⃣"],["șapte","7️⃣"],["șină","🛤️"]],"i"),
    ...W([["mașină","🚗"],["pește","🐟"],["ușă","🚪"],["cămașă","👔"],["păpușă","🪆"],["căpșună","🍓"],["cireașă","🍒"],["brioșă","🧁"],["deșert","🏜️"],["mușchi","💪"],["pușculiță","🐷"]],"m"),
    ...W([["coș","🧺"],["iepuraș","🐰"],["oraș","🏙️"],["cocoș","🐓"],["fluturaș","🦋"],["duș","🚿"]],"f")]},
  z:{l:"Z",re:/([zZ])/g,words:[
    ...W([["zebră","🦓"],["zar","🎲"],["zmeu","🪁"],["zăpadă","❄️"],["zâmbet","😊"],["zână","🧚"],["zece","🔟"],["zid","🧱"],["ziar","📰"],["zgârie-nori","🏙️"]],"i"),
    ...W([["vază","🏺"],["frunză","🍃"],["brânză","🧀"],["dinozaur","🦖"],["ghiozdan","🎒"],["mazăre","🫛"],["varză","🥬"],["magazin","🏪"],["televizor","📺"],["bluză","👚"],["buză","👄"]],"m"),
    ...W([["autobuz","🚌"],["orez","🍚"],["mânz","🐴"]],"f")]},
  j:{l:"J",re:/([jJ])/g,words:[
    ...W([["jucărie","🧸"],["jachetă","🧥"],["jaguar","🐆"],["joben","🎩"],["jeleu","svg:jeleu"],["jos","⬇️"]],"i"),
    ...W([["pijama","svg:pijama"],["plajă","🏖️"],["vrăjitoare","🧙‍♀️"],["bijuterie","💍"],["prăjitură","🍰"],["păianjen","🕷️"]],"m"),
    ...W([["ruj","💄"],["bandaj","🩹"],["patinaj","⛸️"],["bagaj","🧳"],["garaj","🚘"],["masaj","💆"],["mesaj","💬"]],"f")]},
  t:{l:"Ț",re:/([țţȚŢ])/g,words:[
    ...W([["țestoasă","🐢"],["țânțar","🦟"],["țap","🐐"],["țintă","🎯"],["țeavă","svg:teava"],["țiglă","🏠"],["țelină","🥬"]],"i"),
    ...W([["rață","🦆"],["ață","🧵"],["ceață","🌫️"],["gheață","🧊"],["maimuță","🐒"],["veveriță","🐿️"],["fetiță","👧"],["linguriță","🥄"],["periuță","🪥"],["bufniță","🦉"],["pițigoi","🐤"],["brățară","📿"],["pușculiță","🐷"],["dinți","🦷"]],"m"),
    ...W([["prinț","🤴"],["ursuleț","🧸"],["cârnaț","🌭"],["colț","svg:colt"],["pătuț","🛏️"]],"f")]}
};

// ---------- STARE ----------
const store={get(k,d){try{const v=localStorage.getItem("js_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("js_"+k,JSON.stringify(v))}catch(e){}}};
let stars=store.get("stars",0);
let cfg=Object.assign({sound:"s",pos:"all",showWord:false},store.get("cfg",{}));
const saveCfg=()=>store.set("cfg",cfg);
const $stars=document.getElementById("starCount");$stars.textContent=stars;
function addStars(n){stars+=n;store.set("stars",stars);$stars.textContent=stars;const p=$stars.parentElement;p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop")}

const $view=document.getElementById("view"),$back=document.getElementById("backBtn"),$title=document.getElementById("title");
let cleanup=null;
function setView(title,html,showBack=true){if(cleanup){cleanup();cleanup=null}$title.textContent=title;$view.innerHTML=html;$back.classList.toggle("hidden",!showBack);window.scrollTo(0,0)}
$back.onclick=home;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S=()=>SOUNDS[cfg.sound];
const hl=w=>w.replace(S().re,"<b>$1</b>");
function pool(){
  const seen=new Set();
  return S().words.filter(w=>(cfg.pos==="all"||w.p===cfg.pos)).filter(w=>{if(seen.has(w.e))return false;seen.add(w.e);return true});
}
function segBind(sel,key,cast=v=>v,after){
  const btns=document.querySelectorAll(sel+" button");
  const upd=()=>btns.forEach(b=>b.classList.toggle("on",cast(b.dataset.v)===cfg[key]));
  btns.forEach(b=>b.onclick=()=>{cfg[key]=cast(b.dataset.v);saveCfg();upd();after&&after()});upd();
}

// ---------- ACASĂ ----------
function home(){
  setView("🎈 Joaca sunetelor",`
    <div class="card">
      <div class="label">Sunetul</div>
      <div class="seg sounds" id="snd">${Object.entries(SOUNDS).map(([k,v])=>`<button data-v="${k}">${v.l}</button>`).join("")}</div>
      <div class="label">Unde este sunetul?</div>
      <div class="seg" id="pos"><button data-v="all">Oriunde</button><button data-v="i">Început</button><button data-v="m">Mijloc</button><button data-v="f">Final</button></div>
      <div class="label">Cuvântul scris sub imagine</div>
      <div class="seg" id="sw"><button data-v="0">Ascuns</button><button data-v="1">Arată</button></div>
      <div class="hint" id="cnt"></div>
    </div>
    <div class="modes2">
      <button class="mode" style="background:var(--blue)" id="m1"><span>⚡</span>Numește repede<small>tot mai repede</small></button>
      <button class="mode" style="background:var(--purple)" id="m2"><span>🃏</span>Memory<small>spune fiecare carte</small></button>
      <button class="mode" style="background:var(--orange)" id="m3"><span>🙈</span>Ce lipsește?<small>privește și ghicește</small></button>
      <button class="mode" style="background:#e76f51" id="m4"><span>🕵️</span>Intrusul<small>cu ce începe?</small></button>
      <button class="mode" style="background:#2a9d8f" id="m5"><span>🧺</span>Coșurile<small>început, mijloc, final</small></button>
      <button class="mode" style="background:#1d7fb8" id="m6"><span>🎣</span>Pescuitul<small>prinde și numește</small></button>
      <button class="mode" style="background:#c44569;grid-column:1/-1" id="m7"><span>🎰</span>Propoziții trăsnite<small>inventează o propoziție cu imaginile</small></button>
    </div>
    <div class="note">Pentru adult: când auziți un sunet greșit, spuneți liniștit „încă o dată” și mergeți mai departe. Atenția copilului rămâne pe joc, iar sunetul se exersează în vorbirea obișnuită.</div>`,false);
  const cnt=()=>{document.getElementById("cnt").textContent=`${pool().length} cuvinte disponibile`};
  segBind("#snd","sound",v=>v,cnt);segBind("#pos","pos",v=>v,cnt);segBind("#sw","showWord",v=>v==="1");cnt();
  document.getElementById("m1").onclick=speedRun;
  document.getElementById("m2").onclick=memorySetup;
  document.getElementById("m3").onclick=()=>missing(3);
  document.getElementById("m4").onclick=()=>intruder();
  document.getElementById("m5").onclick=()=>baskets();
  document.getElementById("m6").onclick=fishing;
  document.getElementById("m7").onclick=slots;
}
function needWords(n){if(pool().length>=n)return true;
  setView("Prea puține cuvinte",`<div class="card"><p>Pentru acest joc sunt nevoie de cel puțin ${n} cuvinte. Alege „Oriunde” la poziție.</p><div class="row"><button class="btn p" id="hm">Înapoi</button></div></div>`);
  document.getElementById("hm").onclick=home;return false}

// ---------- 1. NUMIRE RAPIDĂ ----------
function speedRun(){
  if(!needWords(3))return;
  const P=pool();let deck=shuffle(P),idx=0,interval=3200,level=1,inBlock=0,blockErr=0,errors=0,shown=0,timer=null,timer2=null,raf=null,t0=0,paused=false;
  const BLOCK=6,MIN=900,TOTAL=36,L=S().l;
  setView(`⚡ Numește repede · ${L}`,`
    <div class="card">
      <div class="pill" id="lvl">Nivel 1</div>
      <div class="bar"><i id="prog"></i></div>
      <div class="img big pop" id="em"></div>
      <div class="word" id="wd"></div>
      <div class="row"><button class="btn r lg" id="err">✘ Greșit</button><button class="btn" id="pause">⏸</button></div>
      <div class="hint" id="info"></div>
    </div>`);
  const $=id=>document.getElementById(id),$em=$("em"),$wd=$("wd"),$prog=$("prog"),$lvl=$("lvl"),$info=$("info");
  function show(){
    if(shown>=TOTAL)return finish();
    if(idx>=deck.length){deck=shuffle(P);idx=0}
    const it=deck[idx++];shown++;inBlock++;
    $em.innerHTML=imgHTML(it.e);$em.classList.remove("pop");void $em.offsetWidth;$em.classList.add("pop");
    $wd.innerHTML=cfg.showWord?hl(it.w):"";
    $info.textContent=`${(interval/1000).toFixed(1)} secunde / imagine · ${shown}/${TOTAL}`;
    t0=performance.now();tick();
    timer=setTimeout(()=>{$wd.innerHTML=hl(it.w);timer2=setTimeout(()=>{if(!paused)next()},300)},interval);
  }
  function tick(){cancelAnimationFrame(raf);const f=()=>{const p=Math.min(1,(performance.now()-t0)/interval);$prog.style.width=p*100+"%";if(p<1)raf=requestAnimationFrame(f)};f()}
  function next(){
    if(inBlock>=BLOCK){
      if(blockErr===0){level++;interval=Math.max(MIN,Math.round(interval*.82));addStars(1);flash("🚀 Mai repede! +1⭐")}
      else if(blockErr>=2){interval=Math.min(3600,Math.round(interval*1.15));flash("🐢 Puțin mai încet")}
      inBlock=0;blockErr=0;
    }
    show();
  }
  function flash(t){$lvl.textContent=t;setTimeout(()=>{if($lvl.isConnected)$lvl.textContent="Nivel "+level},1300)}
  $("err").onclick=()=>{errors++;blockErr++;const b=$("err");b.textContent="✘ notat";setTimeout(()=>{if(b.isConnected)b.textContent="✘ Greșit"},500)};
  $("pause").onclick=e=>{paused=!paused;e.target.textContent=paused?"▶":"⏸";if(paused){clearTimeout(timer);clearTimeout(timer2);cancelAnimationFrame(raf)}else{inBlock--;shown--;idx--;show()}};
  function finish(){
    const key="best_"+cfg.sound,best=store.get(key,0);if(level>best)store.set(key,level);
    setView(`⚡ Numește repede · ${L}`,`
      <div class="card pop"><div class="img big">🏁</div>
        <div class="word">Nivelul ${level}!</div>
        <p>Viteza finală: <b>${(interval/1000).toFixed(1)} s</b> pe imagine<br>Greșeli notate: <b>${errors}</b> din ${TOTAL}</p>
        ${level>best?'<p class="word" style="color:var(--green);font-size:1.4rem">🏆 Record nou!</p>':`<div class="pill">Record: nivelul ${best}</div>`}
        <div class="row"><button class="btn g lg" id="again">Încă o dată</button><button class="btn" id="hm">Acasă</button></div></div>`);
    $("again").onclick=speedRun;$("hm").onclick=home;
  }
  cleanup=()=>{clearTimeout(timer);clearTimeout(timer2);cancelAnimationFrame(raf)};
  show();
}

// ---------- 2. MEMORY ----------
let memPairs=6;
function memorySetup(){
  setView(`🃏 Memory · ${S().l}`,`
    <div class="card">
      <div class="img big">🃏</div>
      <p class="hint">Întoarce câte două cărți și găsește perechile.<br><b>Spune cu voce tare numele fiecărei cărți pe care o întorci.</b></p>
      <div class="label">Câte perechi?</div>

  const btns=document.querySelectorAll("#np button");const upd=()=>btns.forEach(b=>b.classList.toggle("on",+b.dataset.v===memPairs));
  btns.forEach(b=>b.onclick=()=>{memPairs=+b.dataset.v;upd()});upd();
  document.getElementById("go").onclick=memoryRun;
}
function memoryRun(){
  const n=Math.min(memPairs,pool().length);if(!needWords(2))return;
  const chosen=shuffle(pool()).slice(0,n);
  const cards=shuffle([...chosen,...chosen].map((w,i)=>({...w,id:i})));
  let open=[],lock=false,found=0,moves=0;
  setView(`🃏 Memory · ${S().l}`,`
    <div class="row" style="margin:0 0 10px"><div class="pill">Încercări: <span id="mv">0</span></div><div class="pill">Perechi: <span id="fd">0</span>/${n}</div></div>
    <div class="mgrid">${cards.map((c,i)=>`<div class="mcard" data-i="${i}"><div class="in"><div class="bk">?</div><div class="f"><div class="img">${imgHTML(c.e)}</div>${cfg.showWord?`<div class="small-word">${hl(c.w)}</div>`:""}</div></div></div>`).join("")}</div>`);
  const els=[...document.querySelectorAll(".mcard")];let t=null;
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(lock||el.classList.contains("open"))return;
    el.classList.add("open");open.push(i);
    if(open.length===2){
      moves++;document.getElementById("mv").textContent=moves;
      const[a,b]=open;
      if(cards[a].w===cards[b].w){
        els[a].classList.add("done");els[b].classList.add("done");open=[];found++;
        document.getElementById("fd").textContent=found;
        if(found===n)t=setTimeout(()=>memoryDone(n,moves),900);
      }else{lock=true;t=setTimeout(()=>{els[a].classList.remove("open");els[b].classList.remove("open");open=[];lock=false},1300)}
    }
  });
  cleanup=()=>clearTimeout(t);
}
function memoryDone(n,moves){
  const st=moves<=n*1.6?3:moves<=n*2.2?2:1;addStars(st);
  setView(`🃏 Memory · ${S().l}`,`
    <div class="card pop"><div class="img big">🎉</div>
      <div class="word">Toate perechile!</div>
      <p>Ai reușit din <b>${moves}</b> încercări.</p>
      <div class="word">${"⭐".repeat(st)}</div>
      <div class="row"><button class="btn g lg" id="again">Încă o dată</button><button class="btn" id="hm">Acasă</button></div></div>`);
  document.getElementById("again").onclick=memoryRun;document.getElementById("hm").onclick=home;
}

      setView(`🙈 Ce lipsește? · ${S().l}`,`
        <div class="card pop">
          <p class="word" style="font-size:1.5rem">Ce imagine lipsește?</p>
          <div class="lgrid" id="lg">${items.map((w,i)=>cell(w,i===miss)).join("")}</div>

            <button class="btn g lg" id="ok">✔ A ghicit</button>

// ---------- CUVINTE NEUTRE (fără S, Ș, Z, J, Ț) ----------
const NEUTRAL=W([["măr","🍎"],["lună","🌙"],["banană","🍌"],["copac","🌳"],["câine","🐶"],["cal","🐎"],["floare","🌸"],["bec","💡"],["nor","☁️"],["ou","🥚"],["lapte","🥛"],["mână","✋"],["avion","✈️"],["barcă","⛵"],["tren","🚂"],["morcov","🥕"],["inimă","❤️"],["carte","📖"],["peră","🍐"],["lămâie","🍋"],["elefant","🐘"],["leu","🦁"],["vacă","🐄"],["oaie","🐑"],["porc","🐖"],["balon","🎈"],["umbrelă","☂️"],["ochi","👁️"],["ureche","👂"]],"n");
const CLOSE={s:["sh","z","t"],sh:["s","j"],z:["s","j"],j:["sh","z"],t:["s"]};
function pickUnique(arr,n,used=new Set()){const out=[];for(const w of shuffle(arr)){if(out.length>=n)break;if(used.has(w.e))continue;used.add(w.e);out.push(w)}return out}
const firstLetter=w=>w.w[0].toLowerCase();

// ---------- 4. INTRUSUL ----------
let intrLevel=1,intrStreak=0;
const INTR_DESC={1:"Intrusul începe cu un sunet foarte diferit",2:"Intrusul începe cu un sunet asemănător",3:"Intrusul are sunetul, dar nu la început"};
function intruder(){
  const T=S(),L=T.l,starts=T.words.filter(w=>w.p==="i");
  let cand=intrLevel===1?NEUTRAL:intrLevel===2?CLOSE[cfg.sound].flatMap(k=>SOUNDS[k].words.filter(w=>w.p==="i")):T.words.filter(w=>w.p!=="i");
  const used=new Set();const three=pickUnique(starts,3,used);const odd=pickUnique(cand,1,used)[0];
  const items=shuffle([...three.map(w=>({...w,odd:false})),{...odd,odd:true}]);
  setView(`🕵️ Intrusul · ${L}`,`
    <div class="card">
      <div class="seg" id="il">${[1,2,3].map(k=>`<button data-v="${k}" class="${k===intrLevel?"on":""}">Nivel ${k}</button>`).join("")}</div>
      <div class="hint">${INTR_DESC[intrLevel]} · <b>${"🔥".repeat(intrStreak)}${"⚪".repeat(5-intrStreak)}</b></div>
      <p class="word" style="font-size:1.3rem;margin:6px 0">Spune-le pe toate.<br>Care <u>nu</u> începe cu ${L}?</p>
      <div class="mgrid4" id="ig">${items.map((w,i)=>`<div class="icell" data-i="${i}"><div class="img">${imgHTML(w.e)}</div><div class="small-word ${cfg.showWord?"":"hidden"}">${hl(w.w)}</div></div>`).join("")}</div>
      <div class="feedback word" id="fb" style="font-size:1.2rem;min-height:2.2rem"></div>
    </div>`);
  document.querySelectorAll("#il button").forEach(b=>b.onclick=()=>{intrLevel=+b.dataset.v;intrStreak=0;intruder()});
  let done=false,t=null;
  const cells=[...document.querySelectorAll(".icell")],fb=document.getElementById("fb");
  cells.forEach(c=>c.onclick=()=>{
    if(done)return;const it=items[+c.dataset.i];
    if(it.odd){
      done=true;c.classList.add("ok","pop");cells.forEach(x=>x.querySelector(".small-word").classList.remove("hidden"));
      addStars(1);intrStreak++;
      if(intrStreak>=5){intrStreak=0;if(intrLevel<3){intrLevel++;fb.innerHTML=`🏆 Bravo! Treci la nivelul ${intrLevel}!`}else fb.innerHTML="🏆 Ești detectiv adevărat!"}
      else fb.innerHTML=`🎉 Da! <b>${it.w}</b> nu începe cu ${L}.`;
      fb.style.color="var(--green)";t=setTimeout(intruder,2200);
    }else{
      c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake","no");setTimeout(()=>c.classList.remove("no"),600);
      intrStreak=Math.max(0,intrStreak-1);fb.innerHTML="Mai spune-le o dată, încet 🙂";fb.style.color="var(--purple)";
    }
  });
  cleanup=()=>clearTimeout(t);
}

// ---------- 5. COȘURILE ----------
let bLevel=1;
const BASK={i:{n:"Început",d:"●○○"},m:{n:"Mijloc",d:"○●○"},f:{n:"Final",d:"○○●"}};
function baskets(){
  const T=S(),L=T.l,keys=bLevel===1?["i","f"]:["i","m","f"];
  const avail=T.words.filter(w=>keys.includes(w.p));
  const ROUND=10;const deck=pickUnique(avail,ROUND);
  let k=0,errors=0,miss=0;const counts={i:0,m:0,f:0};
  setView(`🧺 Coșurile · ${L}`,`
    <div class="card">
      <div class="seg" id="bl"><button data-v="1" class="${bLevel===1?"on":""}">Nivel 1 · 2 coșuri</button><button data-v="2" class="${bLevel===2?"on":""}">Nivel 2 · 3 coșuri</button></div>
      <div class="pill" id="pr">1/${deck.length}</div>
      <p class="word" style="font-size:1.2rem;margin:4px 0">Spune cuvântul. Unde auzi <b style="color:var(--red)">${L}</b>?</p>
      <div class="img big pop" id="it"></div>
      <div class="word" id="wd" style="font-size:1.6rem"></div>
      <div class="baskets" style="grid-template-columns:repeat(${keys.length},1fr)">${keys.map(x=>`<button class="basket" data-k="${x}"><span class="ic">🧺</span><span class="dots">${BASK[x].d}</span>${BASK[x].n}<span class="n" id="c_${x}">0</span></button>`).join("")}</div>
    </div>`);
  document.querySelectorAll("#bl button").forEach(b=>b.onclick=()=>{bLevel=+b.dataset.v;baskets()});
  const $it=document.getElementById("it"),$wd=document.getElementById("wd");let lock=false,t=null;
  function show(){const w=deck[k];miss=0;$it.className="img big pop";$it.innerHTML=imgHTML(w.e);$wd.innerHTML=cfg.showWord?hl(w.w):"";document.getElementById("pr").textContent=`${k+1}/${deck.length}`;lock=false}
  document.querySelectorAll(".basket").forEach(b=>b.onclick=()=>{
    if(lock)return;const w=deck[k];
    if(b.dataset.k===w.p){
      lock=true;counts[w.p]++;document.getElementById("c_"+w.p).textContent=counts[w.p];
      b.classList.add("ok");$wd.innerHTML=hl(w.w);$it.classList.add("fly");
      t=setTimeout(()=>{b.classList.remove("ok");k++;if(k>=deck.length)finish();else show()},900);
    }else{
      errors++;miss++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake","no");setTimeout(()=>b.classList.remove("no"),600);
      if(miss>=2)$wd.innerHTML=hl(w.w);
    }
  });
  function finish(){
    const st=errors<=1?3:errors<=4?2:1;addStars(st);
    const up=bLevel===1&&errors<=1;
    setView(`🧺 Coșurile · ${L}`,`<div class="card pop"><div class="img big">🧺</div><div class="word">Toate în coșuri!</div>
      <p>Greșeli: <b>${errors}</b></p><div class="word">${"⭐".repeat(st)}</div>
      ${up?'<p class="word" style="font-size:1.2rem;color:var(--green)">Gata pentru 3 coșuri!</p>':""}
      <div class="row"><button class="btn g lg" id="again">${up?"Nivelul 2 →":"Încă o dată"}</button><button class="btn" id="hm">Acasă</button></div></div>`);
    document.getElementById("again").onclick=()=>{if(up)bLevel=2;baskets()};document.getElementById("hm").onclick=home;
  }
  cleanup=()=>clearTimeout(t);
  show();
}

// ---------- 6. PESCUITUL ----------
const FISH_COLORS=["#ffb703","#fb8500","#ff6b6b","#c77dff","#80ed99","#ff8fab","#4cc9f0"];
function fishSVG(c){return `<svg class="body" viewBox="0 0 118 76"><path d="M100 38 L118 14 L114 38 L118 62 Z" fill="${c}" stroke="#0003" stroke-width="2"/><ellipse cx="54" cy="38" rx="50" ry="34" fill="${c}" stroke="#0003" stroke-width="2"/><path d="M48 6 Q62 -4 74 8" fill="${c}" stroke="#0003" stroke-width="2"/><circle cx="16" cy="30" r="5" fill="#fff"/><circle cx="15" cy="30" r="2.6" fill="#222"/></svg>`}
function fishing(){
  const P=pool();if(!needWords(4))return;
  const GOAL=10,N=Math.min(5,P.length);let caught=0,paused=false,raf=null,last=0,speedMul=1,bubT=null;
  setView(`🎣 Pescuitul · ${S().l}`,`
    <div class="row" style="margin:0 0 8px"><div class="pill">🪣 <span id="cg">0</span>/${GOAL}</div></div>
    <div class="sea" id="sea"><div class="wave"></div></div>
    <p class="hint" style="text-align:center">Atinge un pește ca să-l prinzi, apoi spune ce ai prins!</p>`);
  const sea=document.getElementById("sea");
  let W0=sea.clientWidth,H0=sea.clientHeight;
  const fishes=[];const inUse=()=>new Set(fishes.filter(f=>f.w).map(f=>f.w.e));
  function newWord(){const u=inUse();const c=P.filter(w=>!u.has(w.e));return (c.length?c:P)[Math.floor(Math.random()*(c.length?c.length:P.length))]}
  function spawn(f,initial){
    f.w=newWord();const dir=Math.random()<.5?1:-1;f.vx=dir*(28+Math.random()*34);
    const lanes=Math.max(1,Math.floor((H0-110)/82));const lane=fishes.indexOf(f)%lanes;
    f.y=60+lane*82+Math.random()*14;
    f.x=initial?Math.random()*(W0-118):(dir>0?-130:W0+10);
    f.el.querySelector(".fimg").innerHTML=`<div class="img">${imgHTML(f.w.e)}</div>`;
    f.el.querySelector("svg.body").outerHTML=fishSVG(FISH_COLORS[Math.floor(Math.random()*FISH_COLORS.length)]);
    const svg=f.el.querySelector("svg.body");svg.style.transform=dir>0?"scaleX(-1)":"";f.el.classList.toggle("flip",dir>0);
  }
  for(let i=0;i<N;i++){
    const el=document.createElement("div");el.className="fish";el.innerHTML=fishSVG("#fff")+`<div class="fimg"></div>`;sea.appendChild(el);
    const f={el,x:0,y:0,vx:0,w:null};fishes.push(f);spawn(f,true);
  }
  let lastTap=0;
  function onTap(e){
    if(paused)return;const now=Date.now();if(now-lastTap<400)return;
    const pt=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
    const x=pt.clientX,y=pt.clientY,PAD=22;let best=null,bd=1e9;
    for(const f of fishes){const r=f.el.getBoundingClientRect();
      if(x>=r.left-PAD&&x<=r.right+PAD&&y>=r.top-PAD&&y<=r.bottom+PAD){const d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<bd){bd=d;best=f}}}
    if(best){lastTap=now;if(e.cancelable)e.preventDefault();catchFish(best)}
  }
  sea.addEventListener("touchstart",onTap,{passive:false});
  sea.addEventListener("pointerdown",onTap);
  sea.addEventListener("mousedown",onTap);
  sea.addEventListener("click",onTap);
  function loop(ts){
    if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;
    if(!paused){W0=sea.clientWidth;H0=sea.clientHeight;
      for(const f of fishes){f.x+=f.vx*speedMul*dt;f.el.style.transform=`translate(${f.x}px,${f.y+Math.sin(ts/600+f.y)*5}px)`;
        if((f.vx>0&&f.x>W0+20)||(f.vx<0&&f.x<-140))spawn(f,false)}}
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  function bubble(){if(!sea.isConnected)return;const b=document.createElement("div");b.className="bubble";b.style.left=Math.random()*100+"%";b.style.animationDuration=(3+Math.random()*3)+"s";sea.appendChild(b);setTimeout(()=>b.remove(),6000);bubT=setTimeout(bubble,700)}
  bubble();
  function catchFish(f){
    paused=true;caught++;document.getElementById("cg").textContent=caught;
    const ov=document.createElement("div");ov.className="caught";
    ov.innerHTML=`<div class="card pop" style="min-width:240px"><div class="hint">Ai prins…</div><div class="img big">${imgHTML(f.w.e)}</div><div class="word" id="cw">${cfg.showWord?hl(f.w.w):""}</div><p class="word" style="font-size:1.2rem">Spune ce ai prins!</p><div class="row"><button class="btn b lg" id="goon">🎣 ${caught>=GOAL?"Gata!":"Pescuiește mai departe"}</button></div></div>`;
    sea.appendChild(ov);
    ov.querySelector("#goon").onclick=e=>{e.stopPropagation();lastTap=Date.now();
      ov.remove();if(caught>=GOAL)return finish();
      spawn(f,true);speedMul=Math.min(2,speedMul+.08);paused=false;last=0;
    };
  }
  function finish(){
    addStars(3);
    setView(`🎣 Pescuitul · ${S().l}`,`<div class="card pop"><div class="img big">🪣</div><div class="word">Ai prins ${GOAL} pești!</div><div class="word">⭐⭐⭐</div>
      <div class="row"><button class="btn g lg" id="again">Încă o dată</button><button class="btn" id="hm">Acasă</button></div></div>`);
    document.getElementById("again").onclick=fishing;document.getElementById("hm").onclick=home;
  }
  cleanup=()=>{cancelAnimationFrame(raf);clearTimeout(bubT)};
}

// ---------- 7. PROPOZIȚII TRĂSNITE ----------
let reelsN=2;
function slots(){
  const P=pool();if(!needWords(3))return;
  setView(`🎰 Propoziții trăsnite · ${S().l}`,`
    <div class="card">
      <div class="seg" id="rn"><button data-v="2" class="${reelsN===2?"on":""}">2 imagini</button><button data-v="3" class="${reelsN===3?"on":""}">3 imagini</button></div>
      <div class="reels" id="reels">${Array.from({length:reelsN},()=>`<div class="reel"><div class="img">❔</div><div class="small-word"></div></div>`).join("")}</div>
      <p class="word" style="font-size:1.2rem;min-height:3.4rem" id="msg">Învârte și inventează o propoziție trăsnită!</p>
      <div class="row"><button class="btn p lg" id="spin">🎰 Învârte</button><button class="btn g lg hidden" id="said">🎉 Am spus-o!</button></div>
    </div>`);
  document.querySelectorAll("#rn button").forEach(b=>b.onclick=()=>{reelsN=+b.dataset.v;slots()});
  const reels=[...document.querySelectorAll(".reel")],$msg=document.getElementById("msg"),$spin=document.getElementById("spin"),$said=document.getElementById("said");
  let timers=[];
  $spin.onclick=()=>{
    $spin.disabled=true;$said.classList.add("hidden");$msg.textContent="…";
    const final=pickUnique(P,reelsN);
    reels.forEach((r,i)=>{
      r.classList.add("spin");r.querySelector(".small-word").innerHTML="";
      const iv=setInterval(()=>{r.querySelector(".img").innerHTML=imgHTML(P[Math.floor(Math.random()*P.length)].e)},90);timers.push(iv);
      timers.push(setTimeout(()=>{clearInterval(iv);r.classList.remove("spin");r.querySelector(".img").innerHTML=imgHTML(final[i].e);r.classList.add("pop");
        r.querySelector(".small-word").innerHTML=cfg.showWord?hl(final[i].w):"";
        if(i===reels.length-1){$msg.innerHTML=`Inventează o propoziție cu ${reelsN===2?"amândouă imaginile":"toate cele 3 imagini"}!`;$spin.disabled=false;$spin.textContent="🎰 Din nou";$said.classList.remove("hidden")}
      },900+i*600));
    });
  };
  $said.onclick=()=>{addStars(1);$said.classList.add("hidden");$msg.innerHTML="😂 Super! Încă una?"};
  cleanup=()=>timers.forEach(x=>{clearInterval(x);clearTimeout(x)});
}

home();
</script>
</body>
</html>
